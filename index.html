<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Shape Transformation Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --canvas-bg: #020617;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        textarea, input, select, button {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        textarea {
            resize: vertical;
            height: 80px;
            font-family: monospace;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            color: var(--text-main);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .tab-content.active {
            display: flex;
        }

        .canvas-container {
            position: relative;
            background-color: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .matrix-table td, .matrix-table th {
            border: 1px solid var(--border);
            padding: 0.4rem;
            text-align: center;
        }

        .matrix-table th {
            background-color: var(--bg-color);
            color: var(--text-muted);
        }

        .legend {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>2D Transformation Studio</h1>
    </header>

    <div class="container">
        <!-- Controls Panel -->
        <div class="panel">
            <div class="panel-title">1. Vertices Input</div>
            <div class="form-group">
                <label for="presetSelect">Load Preset Shape</label>
                <select id="presetSelect" onchange="loadPreset()">
                    <option value="triangle">Triangle</option>
                    <option value="square">Square</option>
                    <option value="star">Star</option>
                </select>
            </div>
            <div class="form-group">
                <label for="verticesInput">Format: X, Y (One vertex per line)</label>
                <textarea id="verticesInput" placeholder="0, 50&#10;-50, -50&#10;50, -50"></textarea>
            </div>
            <button onclick="updateVertices()">Update Base Vertices</button>

            <div class="panel-title" style="margin-top: 1rem;">2. Transformation</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('translate')">Translate</button>
                <button class="tab-btn" onclick="switchTab('rotate')">Rotate</button>
                <button class="tab-btn" onclick="switchTab('scale')">Scale</button>
            </div>

            <!-- Translate Tab -->
            <div id="tab-translate" class="tab-content active">
                <div class="row">
                    <div class="form-group">
                        <label>dx (X Shift)</label>
                        <input type="number" id="transX" value="30">
                    </div>
                    <div class="form-group">
                        <label>dy (Y Shift)</label>
                        <input type="number" id="transY" value="40">
                    </div>
                </div>
                <button onclick="applyTransform('translate')">Apply Translation</button>
            </div>

            <!-- Rotate Tab -->
            <div id="tab-rotate" class="tab-content">
                <div class="form-group">
                    <label>Angle (Degrees)</label>
                    <input type="number" id="rotAngle" value="45">
                </div>
                <button onclick="applyTransform('rotate')">Apply Rotation</button>
            </div>

            <!-- Scale Tab -->
            <div id="tab-scale" class="tab-content">
                <div class="row">
                    <div class="form-group">
                        <label>sx (X Factor)</label>
                        <input type="number" id="scaleX" value="1.5" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>sy (Y Factor)</label>
                        <input type="number" id="scaleY" value="1.5" step="0.1">
                    </div>
                </div>
                <button onclick="applyTransform('scale')">Apply Scaling</button>
            </div>

            <button class="btn-secondary" onclick="resetTransformations()" style="margin-top: auto;">Reset Transformations</button>
        </div>

        <!-- Canvas Panel -->
        <div class="panel canvas-container">
            <canvas id="viewport"></canvas>
        </div>

        <!-- Output & Data Panel -->
        <div class="panel">
            <div class="panel-title">Calculation Matrix</div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #64748b;"></div>
                    <span>Original</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #6366f1;"></div>
                    <span>Transformed</span>
                </div>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>Coordinates Comparison</label>
                <div style="overflow-x: auto;">
                    <table class="matrix-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Original (X, Y)</th>
                                <th>Transformed (X', Y')</th>
                            </tr>
                        </thead>
                        <tbody id="matrixTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('viewport');
        const ctx = canvas.getContext('2d');
        
        let originalVertices = [];
        let transformedVertices = [];
        let activeTab = 'translate';

        // Presets
        const presets = {
            triangle: [{x: 0, y: 80}, {x: -60, y: -40}, {x: 60, y: -40}],
            square: [{x: -50, y: 50}, {x: 50, y: 50}, {x: 50, y: -50}, {x: -50, y: -50}],
            star: [
                {x: 0, y: 80}, {x: 23, y: 24}, {x: 80, y: 24}, {x: 35, y: -12},
                {x: 52, y: -70}, {x: 0, y: -35}, {x: -52, y: -70}, {x: -35, y: -12},
                {x: -80, y: 24}, {x: -23, y: 24}
            ]
        };

        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            loadPreset();
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function loadPreset() {
            const type = document.getElementById('presetSelect').value;
            originalVertices = JSON.parse(JSON.stringify(presets[type]));
            document.getElementById('verticesInput').value = originalVertices.map(v => `${v.x}, ${v.y}`).join('\n');
            resetTransformations();
        }

        function updateVertices() {
            const text = document.getElementById('verticesInput').value;
            const lines = text.split('\n');
            const parsed = [];
            
            for (let line of lines) {
                const parts = line.split(',');
                if (parts.length === 2) {
                    const x = parseFloat(parts[0].trim());
                    const y = parseFloat(parts[1].trim());
                    if (!isNaN(x) && !isNaN(y)) {
                        parsed.push({x, y});
                    }
                }
            }

            if (parsed.length > 0) {
                originalVertices = parsed;
                resetTransformations();
            } else {
                alert('Invalid input format. Please format as: X, Y');
            }
        }

        function resetTransformations() {
            transformedVertices = JSON.parse(JSON.stringify(originalVertices));
            updateTable();
            draw();
        }

        function applyTransform(type) {
            if (type === 'translate') {
                const dx = parseFloat(document.getElementById('transX').value) || 0;
                const dy = parseFloat(document.getElementById('transY').value) || 0;
                transformedVertices = transformedVertices.map(v => ({
                    x: v.x + dx,
                    y: v.y + dy
                }));
            } 
            else if (type === 'rotate') {
                const angleDeg = parseFloat(document.getElementById('rotAngle').value) || 0;
                const rad = angleDeg * (Math.PI / 180);
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                
                transformedVertices = transformedVertices.map(v => ({
                    x: v.x * cos - v.y * sin,
                    y: v.x * sin + v.y * cos
                }));
            } 
            else if (type === 'scale') {
                const sx = parseFloat(document.getElementById('scaleX').value) || 1;
                const sy = parseFloat(document.getElementById('scaleY').value) || 1;
                transformedVertices = transformedVertices.map(v => ({
                    x: v.x * sx,
                    y: v.y * sy
                }));
            }

            updateTable();
            draw();
        }

        function updateTable() {
            const tbody = document.getElementById('matrixTableBody');
            tbody.innerHTML = '';

            originalVertices.forEach((orig, i) => {
                const trans = transformedVertices[i];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>V${i+1}</td>
                    <td>(${orig.x.toFixed(1)}, ${orig.y.toFixed(1)})</td>
                    <td>(${trans.x.toFixed(1)}, ${trans.y.toFixed(1)})</td>
                `;
                tbody.appendChild(row);
            });
        }

        function drawGrid(centerX, centerY) {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;

            const step = 20;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            
            // X-Axis
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            // Y-Axis
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
        }

        function drawShape(vertices, color, centerX, centerY) {
            if (vertices.length === 0) return;

            ctx.strokeStyle = color;
            ctx.fillStyle = color + '20'; // Semi-transparent fill
            ctx.lineWidth = 2;

            ctx.beginPath();
            // Convert Cartesian to Canvas coordinates (Y is inverted)
            ctx.moveTo(centerX + vertices[0].x, centerY - vertices[0].y);
            
            for (let i = 1; i < vertices.length; i++) {
                ctx.lineTo(centerX + vertices[i].x, centerY - vertices[i].y);
            }
            
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Draw vertex points
            ctx.fillStyle = color;
            vertices.forEach(v => {
                ctx.beginPath();
                ctx.arc(centerX + v.x, centerY - v.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            drawGrid(centerX, centerY);
            drawShape(originalVertices, '#64748b', centerX, centerY);
            drawShape(transformedVertices, '#6366f1', centerX, centerY);
        }

        window.onload = init;
    </script>
</body>
</html>
